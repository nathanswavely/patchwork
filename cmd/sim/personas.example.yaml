# Personas for the governance simulation (docs/adr/096, docs/testing/governance-simulation.md).
#
# Every person here is fiction (docs/adr/009). Five organizations, chosen to
# cover the leadership and venue matrix, with a few people who belong to two
# — cross-membership is the thread the quilt is built on, so a simulation with
# none would be testing a different product.
#
#   Tin Roof Choir             a band          maintainer, decides by admin, minimal template
#   Bobbin Hall Co-op          a venue         elected, six-month staggered terms, elections in Patchwork
#   Northwest Corridor Neighbors  a coalition  meets in person: both venues elsewhere, attestations only
#   Loose Threads Press        a collective    meritocratic, nominate-and-ratify, charter amendments
#   The Remnant Room           the chaos org   starts one way and changes its mind mid-term
#
# The tool mints `sim-<username>` as each person's session token.

personas:
