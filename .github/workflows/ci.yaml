name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Manual runs, e.g. re-publishing the image after a registry permission fix.
  workflow_dispatch:

# Least privilege by default. `packages: write` lives on the `image` job only —
# the `test` job runs project code and third-party deps, and must not hold a
# token that can push to ghcr.io.
permissions:
  contents: read

# Serialize per ref so two quick pushes to main can't race and leave the loser
# as :latest (production pulls :latest). Tag builds are never cancelled — a
# release must publish even if another tag lands while it's running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Every third-party action is pinned to a full commit SHA: a tag is mutable, and
# a moved tag would execute attacker code inside CI. The trailing comment is the
# human-readable version; dependabot (.github/dependabot.yml) keeps both current.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build

      # govulncheck below covers Go; until this step existed nothing at all
      # looked at the frontend tree, which is the half that ships to browsers.
      #
      # Two thresholds on purpose. Production deps are executed by every visitor,
      # so a moderate advisory there (an XSS bypass in dompurify, say) should stop
      # the build; dev tooling only runs on our own machines, so it gates at high
      # to avoid blocking merges on a ReDoS in a test runner. Neither is symbol-
      # level like govulncheck — expect the occasional unreachable advisory, and
      # fix it forward rather than adding blanket excludes.
      - name: npm audit (production deps)
        run: cd web && npm audit --omit=dev --audit-level=moderate

      - name: npm audit (all deps)
        run: cd web && npm audit --audit-level=high

      # Verifies each package's registry signature against npm's public keys —
      # catches a tampered tarball served for a legitimate version, which the
      # advisory database above cannot see.
      - name: npm audit signatures
        run: cd web && npm audit signatures

      - name: Frontend unit tests
        run: cd web && npx vitest run

      # The copy ratchet (tools/copy-ledger). Fails when a string a visitor
      # can read entered the source without anyone recording who wrote it.
      # The existing backlog is grandfathered via the ledger's baseline, so
      # this gates new copy only — it is not a wall in front of the cleanup.
      # Needs no dependencies: the tool is plain Node with no imports.
      - name: Copy provenance ledger
        run: make copy-check

      # The ledger has two review surfaces (the local UI and Markdown drafts),
      # and the rule keeping them from overwriting each other is not visible in
      # any output — so it is tested rather than remembered.
      - name: Copy ledger draft safety
        run: make copy-test

      # go.mod's `go` directive carries a full patch version on purpose: setup-go
      # installs it exactly, so a bare `go 1.25` would hand CI a toolchain with
      # every stdlib CVE patched since .0 still live. govulncheck below enforces it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Go build
        run: go build ./...

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test ./...

      # Fails the build on a known CVE reachable from our call graph. Symbol-level
      # analysis, so an advisory in a dependency we never call doesn't block merges.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  smoke:
    # Recreate-survival test: builds the real image, writes data through the
    # API, force-recreates the container, and checks the data is still there.
    # It also asserts the image's HEALTHCHECK reports healthy.
    #
    # This runs in CI because it silently rotted otherwise — the script broke
    # when signup started requiring a chosen username (adr/013) and nobody
    # noticed, so the regression test for the 2026-07-19 data-loss incident
    # was dead for weeks. Nothing else in CI exercises the container.
    #
    # Deliberately NOT gated on `test`: this job builds the image from source
    # and consumes nothing `test` produces, so the dependency bought only a
    # "don't burn minutes on a doomed PR" gate — and Actions minutes are free
    # on a public repo. It cost ~2min of wall clock on every PR to save
    # nothing. Publishing is still fully gated; see `image` below.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Recreate-survival smoke test
        run: scripts/smoke-recreate.sh

  e2e:
    # The full Playwright suites — seeded instance and empty instance — against
    # a real backend (`go run`, cgo/sqlite) plus Vite. The suites boot their own
    # isolated stacks on checkout-derived ports (web/e2e/ports.js) and fall back
    # to patchwork.yaml.example, so the job needs no services and no setup
    # beyond toolchains and a Chromium.
    #
    # Not gated on `test` either, for the same reason as `smoke` above: the
    # Playwright config builds web/dist itself when it's missing, so this job
    # depends on no earlier artifact. All three jobs now start at once.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install frontend deps
        run: cd web && npm ci

      - name: Install Playwright Chromium
        run: cd web && npx playwright install --with-deps chromium

      - name: e2e (seeded instance)
        run: cd web && npx playwright test

      - name: e2e (empty instance)
        run: cd web && npx playwright test --config playwright.empty.config.js

  image:
    # Build each architecture on its own NATIVE runner, in parallel, pushing
    # only a digest — no tag. The `manifest` job below assembles the tags.
    #
    # arm64 used to cross-build under QEMU on the amd64 runner and cost ~15min
    # of every release; the whole rest of the pipeline is ~6min. A native arm64
    # runner (free for public repos) removes the emulation instead of removing
    # the architecture — "runs on a Raspberry Pi 4" is a promise this project
    # makes, so the fix is to make multi-arch cheap, not optional.
    #
    # Hard-gated on the whole pipeline: nothing publishes — release tag or
    # :latest — unless unit suites, the recreate-survival smoke test, AND the
    # full e2e suites are green. Production pulls these images; a red suite
    # must mean no artifact. The cost is publish latency (e2e is the long
    # pole); a genuinely flaky e2e test blocks releases and should be treated
    # as a release blocker itself, not routed around.
    needs: [test, smoke, e2e]
    # Publishes on pushes and on manual runs (workflow_dispatch only fires
    # from main, so a manual run republishes :latest).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      # Both legs run to completion so a release failure reports every broken
      # architecture at once. Nothing is tagged here, so a half-finished matrix
      # publishes nothing — `manifest` needs every leg.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      # Required by build-push-action to push provenance/SBOM attestations.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are deliberately absent here — this job pushes by digest only.
      # The action still supplies labels and annotations for the per-platform
      # image, and `manifest` re-runs it to get the tag list.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}

      # The binary's -X Version stamp used to come from `git describe` inside the
      # Dockerfile, which silently degraded to a bare SHA: actions/checkout is
      # shallow and fetches no tags, so main builds never saw one. Pass it in
      # explicitly instead — the tag on a release, the full commit SHA otherwise.
      - name: Resolve version stamp
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          # push-by-digest: the registry gets the layers and a digest, but no
          # tag moves. Until `manifest` runs, :latest and :X.Y.Z still point at
          # the previous release — a failed build cannot leave a tag resolving
          # for one architecture and 404ing for the other.
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          # Carries org.opencontainers.image.revision, so `docker inspect` on the
          # server answers "what commit is this?" without guessing.
          labels: ${{ steps.meta.outputs.labels }}
          # Full build provenance + SBOM. This project asks other communities to
          # run its image; they should be able to audit what's in it.
          provenance: mode=max
          sbom: true
          # Scoped per platform: one shared scope would have the two legs
          # evicting each other's layers every run.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # The digest travels to `manifest` as a FILENAME, so the `sha256:` prefix
      # has to come off: artifact paths reject a colon (they must stay valid on
      # Windows). The manifest job re-adds `@sha256:` when it assembles the list.
      - name: Export digest
        env:
          digest: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Name the digest artifact after the platform
        id: pair
        run: echo "value=${platform//\//-}" >> "$GITHUB_OUTPUT"
        env:
          platform: ${{ matrix.platform }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ steps.pair.outputs.value }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    # The only step that creates a tag. It runs once, after every architecture
    # has pushed its digest, so `:X.Y.Z` appears complete or not at all — a Pi
    # self-hoster never meets a tag that resolves for amd64 and 404s for arm64.
    # The manifest digest is final at publish time, which is what deploy records
    # and rollback points are pinned to.
    needs: image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      # Proof, in the run log, that the published tag really carries both
      # architectures — the thing this whole split exists to guarantee.
      - name: Inspect published manifest
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"
